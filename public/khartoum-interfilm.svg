<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b5cff"/>
      <stop offset="50%" stop-color="#4bc6ff"/>
      <stop offset="100%" stop-color="#f6c88a"/>
    </linearGradient>
    <style>
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-weight: 700; fill: #111827; font-size:48px }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-weight: 500; fill: #374151; font-size:20px }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fff" />

  <!-- Stylized K box on left -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="320" height="320" rx="24" fill="url(#g)" />
    <g transform="translate(40,34) scale(0.95)">
      <path d="M40 0 L120 0 L40 80 L120 160 L40 240 L0 240 L80 120 L0 0 Z" fill="#fff" opacity="0.08" />
    </g>
  </g>

  <!-- Text on right -->
  <g transform="translate(420,140)">
    <text class="title">Khartoum</text>
    <text class="title" y="54">Interfilm</text>
    <text class="subtitle" y="100">Marketing agency</text>
  </g>
</svg>